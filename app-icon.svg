<svg width="1024" height="1024" viewBox="-45 -35 190 190" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="v1ArrowGrad" x1="50" y1="10" x2="50" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="20%" stop-color="#E9D5FF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="v1Shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="v1ArrowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#3B0764" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Bottom Plate: Midnight Purple -->
  <g transform="translate(50, 80) scale(1, 0.5) rotate(-45)">
    <rect x="-35" y="-35" width="70" height="70" rx="14" fill="#3B0764" stroke="#2E1065" stroke-width="2"/>
  </g>

  <!-- Middle Plate: Deep Violet -->
  <g transform="translate(50, 60) scale(1, 0.5) rotate(-45)" filter="url(#v1Shadow)">
    <rect x="-35" y="-35" width="70" height="70" rx="14" fill="#6D28D9" stroke="#8B5CF6" stroke-width="2"/>
  </g>

  <!-- Arrow: Brilliant Lilac/White -->
  <path d="M 50 18 L 68 36 L 55 36 L 55 58 L 45 58 L 45 36 L 32 36 Z" 
        fill="url(#v1ArrowGrad)" stroke="url(#v1ArrowGrad)" stroke-width="5" stroke-linejoin="round"
        filter="url(#v1ArrowShadow)"/>
</svg>
